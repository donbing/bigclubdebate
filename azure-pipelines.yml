# Big Club Debate — CI/CD Pipeline
# Builds .NET 10 Blazor Server app, runs tests, deploys to Azure App Service (Linux)

trigger:
  - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '10.x'
  webProject: 'BigClubDebate.Web/BigClubDebate.Web.csproj'
  publishPath: '$(Build.ArtifactStagingDirectory)/publish'
  azureSubscription: 'XvsY'
  appServiceName: 'app-bigclubdebate-prod'

stages:
  # ── Build & Test ────────────────────────────────────────────
  - stage: Build
    displayName: 'Build & Test'
    jobs:
      - job: BuildAndTest
        displayName: 'Build, Test & Publish'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK $(dotnetVersion)'
            inputs:
              version: $(dotnetVersion)

          - task: DotNetCoreCLI@2
            displayName: 'Restore'
            inputs:
              command: 'restore'
              projects: '**/*.sln'

          - task: DotNetCoreCLI@2
            displayName: 'Build'
            inputs:
              command: 'build'
              projects: '**/*.sln'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Test'
            inputs:
              command: 'test'
              projects: '**/*.sln'
              arguments: '--configuration $(buildConfiguration) --no-build'

          - task: DotNetCoreCLI@2
            displayName: 'Publish (self-contained Linux)'
            inputs:
              command: 'publish'
              projects: $(webProject)
              arguments: >-
                --configuration $(buildConfiguration)
                --runtime linux-x64
                --self-contained true
                --output $(publishPath)
              zipAfterPublish: false

          - task: ArchiveFiles@2
            displayName: 'Zip publish output'
            inputs:
              rootFolderOrFile: $(publishPath)
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/deploy.zip'

          - publish: '$(Build.ArtifactStagingDirectory)/deploy.zip'
            artifact: 'drop'
            displayName: 'Publish artifact'

  # ── Deploy ──────────────────────────────────────────────────
  - stage: Deploy
    displayName: 'Deploy to App Service'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployWeb
        displayName: 'Deploy Web App'
        environment: 'XvsY-prod'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Deploy to App Service'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: 'pscore'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az webapp deploy `
                        --name app-bigclubdebate-prod-7tu62mgi5mhu2 `
                        --resource-group rg-bigclubdebate-prod `
                        --type zip `
                        --src-path $(Pipeline.Workspace)/drop/deploy.zip
