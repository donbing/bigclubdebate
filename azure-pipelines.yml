# Big Club Debate — CI/CD Pipeline
# Builds .NET 10 Blazor Server app with Aspire orchestration, runs tests,
# deploys to Azure Container Apps via `aspire deploy`.
#
# Production URL: https://web.jollyplant-cd6dc099.westeurope.azurecontainerapps.io/
#
# Environments:
#   - Staging (bigclubdebate-staging): automatic on master merge
#   - Production (bigclubdebate-production): manual approval gate
#
# Azure DevOps: https://chrisbingham.visualstudio.com/XvsY
#
# One-time setup (already done — environments are created):
#   .\scripts\Setup-AzureDevOpsEnvironments.ps1 -Organization "chrisbingham" -Project "XvsY"
#
# To enable manual approval on Production (recommended):
#   1. Go to https://chrisbingham.visualstudio.com/XvsY/_settings/environments
#   2. Open "bigclubdebate-production"
#   3. Add → Approvals → add yourself as approver

trigger:
  - master

# PR validation — runs Build & Test stage on every PR to master
pr:
  - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '10.x'
  solution: '**/*.sln'
  appHostProject: 'BigClubDebate.AppHost'
  azureSubscription: 'XvsY'

stages:
  # ── Build & Test ────────────────────────────────────────────
  - stage: Build
    displayName: 'Build & Test'
    jobs:
      - job: BuildAndTest
        displayName: 'Build, Test & Publish'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK $(dotnetVersion)'
            inputs:
              version: $(dotnetVersion)

          - task: DotNetCoreCLI@2
            displayName: 'Restore'
            inputs:
              command: 'restore'
              projects: $(solution)

          - task: DotNetCoreCLI@2
            displayName: 'Build'
            inputs:
              command: 'build'
              projects: $(solution)
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Run tests'
            inputs:
              command: 'test'
              projects: $(solution)
              arguments: '--configuration $(buildConfiguration) --no-build'

  # ── Deploy Staging ──────────────────────────────────────────
  - stage: DeployStaging
    displayName: 'Deploy to Staging (ACA)'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
    jobs:
      - deployment: DeployStagingACA
        displayName: 'Deploy to Staging ACA'
        environment: 'bigclubdebate-staging'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: UseDotNet@2
                  displayName: 'Install .NET SDK $(dotnetVersion)'
                  inputs:
                    version: $(dotnetVersion)

                - task: DotNetCoreCLI@2
                  displayName: 'Install Aspire workload'
                  inputs:
                    command: 'custom'
                    custom: 'workload'
                    arguments: 'install aspire --skip-sign-check'

                - task: AzureCLI@2
                  displayName: 'Deploy to ACA (Staging)'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      aspire deploy \
                        --apphost $(appHostProject) \
                        --environment Staging \
                        --non-interactive

  # ── Deploy Production ───────────────────────────────────────
  - stage: DeployProduction
    displayName: 'Deploy to Production (ACA)'
    dependsOn: DeployStaging
    condition: succeeded()
    jobs:
      - deployment: DeployProductionACA
        displayName: 'Deploy to Production ACA'
        environment: 'bigclubdebate-production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: UseDotNet@2
                  displayName: 'Install .NET SDK $(dotnetVersion)'
                  inputs:
                    version: $(dotnetVersion)

                - task: DotNetCoreCLI@2
                  displayName: 'Install Aspire workload'
                  inputs:
                    command: 'custom'
                    custom: 'workload'
                    arguments: 'install aspire --skip-sign-check'

                - task: AzureCLI@2
                  displayName: 'Deploy to ACA (Production)'
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      aspire deploy \
                        --apphost $(appHostProject) \
                        --environment Production \
                        --non-interactive
